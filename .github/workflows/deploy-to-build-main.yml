#
# deploy-to-build-main.yml — Hostinger production deploy gate
#
# Trigger: push to main + manual workflow_dispatch.
# Steps:   checkout -> node 20 -> npm ci -> precheck -> build -> push dist/
#          to build-main branch via s0/git-publish-subdir-action.
# Hostinger hPanel Git integration pulls build-main into /public_html/.
# Concurrency group prevents overlapping runs (no half-pushed branch state).

name: kyo-web-online - Build and Deploy to build-main

on:
  push:
    branches:
      - main
  # A merge in Kyonax/kyo-blog fires this. Blog CONTENT lives in that
  # repository, so a new article changes nothing here and would otherwise
  # never reach production.
  repository_dispatch:
    types: [blog-updated]
  workflow_dispatch:

concurrency:
  group: deploy-build-main-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build and Push
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    env:
      # Every step below reads the same corpus; sync-blog.mjs falls back to an
      # empty manifest if this path does not exist.
      BLOG_DIST: ${{ github.workspace }}/kyo-blog/dist

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      # Blog content, checked out beside this repo. sync-blog.mjs (wired into
      # prebuild) reads BLOG_DIST and copies the manifest, the post bodies, the
      # search indexes and the media in. If this step is ever removed the build
      # still succeeds — sync-blog writes an empty manifest and the site ships
      # exactly as it did before the blog existed.
      - name: Checkout blog content
        uses: actions/checkout@v4
        with:
          repository: Kyonax/kyo-blog
          ref: main
          path: kyo-blog

      - name: Build the blog corpus
        working-directory: kyo-blog
        run: |
          npm ci
          npm run blog:build

      - name: Run precheck gate
        run: npm run precheck

      - name: Build App
        run: npm run build

      - name: Push to build-main
        uses: s0/git-publish-subdir-action@develop
        env:
          REPO: self
          BRANCH: build-main
          FOLDER: dist
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          MESSAGE: "Build in Main Environment: ({sha}) {msg}"
          SQUASH_HISTORY: true
